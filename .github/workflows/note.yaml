name: Note Workflow

on:
  workflow_dispatch:
    inputs:
      theme:
        description: 'theme / 記事テーマ・仮タイトル'
        required: true
        type: string
      target:
        description: 'target / 想定読者'
        required: true
        type: string
      message:
        description: 'message / 記事で一番伝えたいこと'
        required: true
        type: string
      cta:
        description: 'cta / 読者に促す行動'
        required: true
        type: string
      tags:
        description: 'tags / カンマ区切りタグ'
        required: false
        default: ''
        type: string
      reference_url:
        description: 'reference_url / 参考note URL'
        required: false
        default: ''
        type: string
      reference_mode:
        description: 'reference_mode / 参考記事の使い方'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - structure_only
          - explanation_pattern
      original_angle:
        description: 'original_angle / 参考記事との差別化'
        required: false
        default: ''
        type: string
      demo_topic:
        description: 'demo_topic / 記事内で実演する内容'
        required: false
        default: ''
        type: string
      tools_used:
        description: 'tools_used / 実演で使うツール'
        required: false
        default: ''
        type: string
      asset_urls:
        description: 'asset_urls / 参照・埋め込み用URL'
        required: false
        default: ''
        type: string
      is_public:
        description: 'is_public / 公開投稿する'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      dry_run:
        description: 'dry_run / note投稿をスキップ'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

env:
  TZ: Asia/Tokyo
  GEMINI_MODEL: gemini-2.5-flash
  IMAGEN_MODEL: imagen-4.0-generate-001

jobs:
  reference:
    name: Analyze reference article
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STATE_JSON: ${{ secrets.NOTE_STORAGE_STATE_JSON }}
      REFERENCE_URL: ${{ github.event.inputs.reference_url }}
      REFERENCE_MODE: ${{ github.event.inputs.reference_mode }}
      ORIGINAL_ANGLE: ${{ github.event.inputs.original_angle }}
      DEMO_TOPIC: ${{ github.event.inputs.demo_topic }}
      TOOLS_USED: ${{ github.event.inputs.tools_used }}
      ASSET_URLS: ${{ github.event.inputs.asset_urls }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        if: ${{ github.event.inputs.reference_url != '' && github.event.inputs.reference_mode != 'none' }}
        run: npx playwright install --with-deps chromium | cat

      - name: Prepare storageState
        id: state
        if: ${{ github.event.inputs.reference_url != '' && github.event.inputs.reference_mode != 'none' }}
        run: |
          test -n "$STATE_JSON" || (echo "ERROR: NOTE_STORAGE_STATE_JSON secret is not set" && exit 1)
          mkdir -p "$RUNNER_TEMP"
          echo "$STATE_JSON" > "$RUNNER_TEMP/note-state.json"
          echo "STATE_PATH=$RUNNER_TEMP/note-state.json" >> $GITHUB_OUTPUT

      - name: Analyze reference
        env:
          STATE_PATH: ${{ steps.state.outputs.STATE_PATH }}
        run: node scripts/analyze-reference.mjs

      - name: Upload reference artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reference-artifacts
          path: |
            .note-artifacts/reference-analysis.json
            .note-artifacts/reference-analysis.md

  research:
    name: Research (Gemini Google Search)
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      THEME: ${{ github.event.inputs.theme }}
      TARGET: ${{ github.event.inputs.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Research with Gemini
        run: node scripts/research.mjs

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: research-artifacts
          path: |
            .note-artifacts/research.md
            .note-artifacts/research_trace.json

  write:
    name: Write (Gemini)
    needs:
      - research
      - reference
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      THEME: ${{ github.event.inputs.theme }}
      TARGET: ${{ github.event.inputs.target }}
      MESSAGE: ${{ github.event.inputs.message }}
      CTA: ${{ github.event.inputs.cta }}
      INPUT_TAGS: ${{ github.event.inputs.tags }}
      REFERENCE_MODE: ${{ github.event.inputs.reference_mode }}
      ORIGINAL_ANGLE: ${{ github.event.inputs.original_angle }}
      DEMO_TOPIC: ${{ github.event.inputs.demo_topic }}
      TOOLS_USED: ${{ github.event.inputs.tools_used }}
      ASSET_URLS: ${{ github.event.inputs.asset_urls }}
    outputs:
      title: ${{ steps.collect.outputs.title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Download research artifacts
        uses: actions/download-artifact@v4
        with:
          name: research-artifacts
          path: .note-artifacts

      - name: Download reference artifacts
        uses: actions/download-artifact@v4
        with:
          name: reference-artifacts
          path: .note-artifacts

      - name: Generate draft
        run: node scripts/write.mjs

      - name: Collect draft
        id: collect
        run: |
          title=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.note-artifacts/draft.json','utf8')).title)")
          echo "title<<EOF" >> $GITHUB_OUTPUT
          echo "$title" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: draft-artifact
          path: .note-artifacts/draft.json

  factcheck:
    name: Fact-check (Gemini Google Search)
    needs: write
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TITLE: ${{ needs.write.outputs.title }}
    outputs:
      title: ${{ steps.collect.outputs.title }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Download draft artifact
        uses: actions/download-artifact@v4
        with:
          name: draft-artifact
          path: .note-artifacts

      - name: Fact-check with Gemini
        run: node scripts/factcheck.mjs

      - name: Upload fact-check artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-artifact
          path: .note-artifacts/final.json

      - name: Collect final
        id: collect
        run: |
          title=$(node -e "console.log(JSON.parse(require('fs').readFileSync('.note-artifacts/final.json','utf8')).title)")
          echo "title<<EOF" >> $GITHUB_OUTPUT
          echo "$title" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  images:
    name: Generate section images (Imagen)
    needs: factcheck
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Download final artifact
        uses: actions/download-artifact@v4
        with:
          name: final-artifact
          path: .note-artifacts

      - name: Generate one image per level-2 heading
        run: node scripts/generate-images.mjs

      - name: Upload final with image paths
        uses: actions/upload-artifact@v4
        with:
          name: final-with-images
          path: |
            .note-artifacts/final.json
            .note-artifacts/image-manifest.json

      - name: Upload generated images
        uses: actions/upload-artifact@v4
        with:
          name: note-section-images
          path: .note-artifacts/images/*.png

  post:
    name: Post to note.com (Playwright)
    needs:
      - factcheck
      - images
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    env:
      IS_PUBLIC: ${{ github.event.inputs.is_public }}
      STATE_JSON: ${{ secrets.NOTE_STORAGE_STATE_JSON }}
      START_URL: https://editor.note.com/new
    outputs:
      final_url: ${{ steps.publish.outputs.published_url || steps.publish.outputs.draft_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium | cat

      - name: Download final json
        uses: actions/download-artifact@v4
        with:
          name: final-with-images
          path: .note-artifacts

      - name: Download generated images
        uses: actions/download-artifact@v4
        with:
          name: note-section-images
          path: .note-artifacts/images

      - name: Prepare storageState
        id: state
        run: |
          test -n "$STATE_JSON" || (echo "ERROR: NOTE_STORAGE_STATE_JSON secret is not set" && exit 1)
          mkdir -p "$RUNNER_TEMP"
          echo "$STATE_JSON" > "$RUNNER_TEMP/note-state.json"
          echo "STATE_PATH=$RUNNER_TEMP/note-state.json" >> $GITHUB_OUTPUT

      - name: Ensure jq
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi

      - name: Restore final
        id: draft
        run: |
          cp .note-artifacts/final.json final.json
          echo "TITLE=$(jq -r .title final.json)" >> $GITHUB_OUTPUT
          echo "TAGS=$(jq -r '.tags | join(", ")' final.json)" >> $GITHUB_OUTPUT

      - name: Publish via Playwright
        id: publish
        env:
          TITLE: ${{ steps.draft.outputs.TITLE }}
          TAGS: ${{ steps.draft.outputs.TAGS }}
          STATE_PATH: ${{ steps.state.outputs.STATE_PATH }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/note-debug"
          export NOTE_DEBUG_DIR="$RUNNER_TEMP/note-debug"
          set +e
          node scripts/post.mjs 2>&1 | tee post.log
          status=${PIPESTATUS[0]}
          set -e
          url=$(grep '^PUBLISHED_URL=' post.log | tail -n1 | cut -d'=' -f2- || true)
          draft=$(grep '^DRAFT_URL=' post.log | tail -n1 | cut -d'=' -f2- || true)
          shot=$(grep '^SCREENSHOT=' post.log | tail -n1 | cut -d'=' -f2- || true)
          debug=$(grep '^DEBUG_HTML=' post.log | tail -n1 | cut -d'=' -f2- || true)
          if [ -n "$url" ]; then echo "published_url=$url" >> $GITHUB_OUTPUT; fi
          if [ -n "$draft" ]; then echo "draft_url=$draft" >> $GITHUB_OUTPUT; fi
          if [ -n "$shot" ]; then echo "screenshot=$shot" >> $GITHUB_OUTPUT; fi
          if [ -n "$debug" ]; then echo "debug_html=$debug" >> $GITHUB_OUTPUT; fi
          exit "$status"

      - name: Upload screenshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: note-screenshot
          path: ${{ runner.temp }}/note-debug/note-post.png
          if-no-files-found: ignore

      - name: Upload editor debug
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: note-editor-debug
          path: ${{ runner.temp }}/note-debug/note-editor-debug.html
          if-no-files-found: ignore
